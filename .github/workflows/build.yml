name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Windows build ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pygame numpy pyinstaller

      - name: Build Windows EXE
        run: pyinstaller --onefile --windowed --name SpaceInvaders space_invaders.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceInvaders-Windows
          path: dist/SpaceInvaders.exe

  # ── macOS build ──────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pygame numpy pyinstaller

      - name: Build macOS app
        run: pyinstaller --onefile --windowed --name SpaceInvaders space_invaders.py

      - name: Zip macOS binary
        run: cd dist && zip SpaceInvaders-macOS.zip SpaceInvaders

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceInvaders-macOS
          path: dist/SpaceInvaders-macOS.zip

  # ── Create / update rolling "latest" release ─────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: SpaceInvaders-Windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: SpaceInvaders-macOS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            Automatically built from the latest commit on `main`.

            | Platform | File |
            |----------|------|
            | 🪟 Windows | `SpaceInvaders-Windows.exe` |
            | 🍎 macOS | `SpaceInvaders-macOS.zip` |

            **macOS:** unzip, then right-click → Open if you see a security warning.
          files: |
            SpaceInvaders.exe
            SpaceInvaders-macOS.zip
          make_latest: true
